apiVersion: deploy.kweaver.ai/v1alpha1
kind: VersionSet
product: kweaver-dip
# 冻结版本 manifest：从 main 快照而来，版本号已固定。
# 发布后 releases[*].version 不应再变化。
version: 0.6.0
# 0.6.0 中多数 chart 仍由旧 CI 产出，因此 source 默认指向 HTTP helm 仓库与 SWR 镜像仓库。
# 已迁移到 kweaver-dip github-action pipeline 的 chart，在各自条目中用
# helmRepoUrl / imageRegistry 显式覆盖到 OCI + ghcr。
# 后续旧 pipeline chart 迁移到新 pipeline 时，为对应条目加上这两个覆盖字段即可。
source:
  helmRepoUrl: https://kweaver-ai.github.io/helm-repo/
  imageRegistry: swr.cn-east-3.myhuaweicloud.com/kweaver-ai
dependencies:
- product: isf
  version: 0.6.0
  manifest: ./isf.yaml
- product: kweaver-core
  version: 0.6.0
  manifest: ./kweaver-core.yaml

releases:
  # ===== 旧 pipeline（继承 source 默认：HTTP helm 仓库 + SWR 镜像仓库） =====
  dip-data-migrator:
    chart: dip-data-migrator
    version: 0.5.0-main.20260420.1.2f7545f
    stage: pre
  business-system-service:
    chart: business-system-service
    version: 0.3.0-1d43acc
  mf-model-manager-nginx:
    chart: mf-model-manager-nginx
    version: 0.5.0-main.git-2a143e0.1796934
  vega-web:
    chart: vega-web
    version: 0.5.1-main
  operator-web:
    chart: operator-web
    version: 0.5.0-main.git-671eead
  mdl-manage-web:
    chart: mdl-manage-web
    version: 0.5.0-develop.git-c7b1b0
  agent-web:
    chart: agent-web
    version: 0.5.1-main.git-a89f3eb
  flow-web:
    chart: flow-web
    version: 0.5.1-main.git+671eead
  doc-audit-client:
    chart: doc-audit-client
    version: 0.5.1-main.git-671eead
  workflow:
    chart: workflow
    version: 0.3.0-main.git-git+37cf114.1795485
  workflow-manage-client:
    chart: workflow-manage-client
    version: 0.5.0-main.git-84bea21
  workflow-manage-front:
    chart: workflow-manage-front
    version: 0.5.0-main.git-84bea21
  anyfabric-frontend:
    chart: anyfabric-frontend
    version: 0.5.0-main.20260417.2
  dip-hub:
    chart: dip-hub
    version: 0.5.0
  dip-frontend:
    chart: dip-frontend
    version: 0.5.0-main.5ba829f
    values:
      runtimeEnv:
        publicEnabledModules: "store,studio"  # 允许值：store,studio（多个用英文逗号分隔）
  data-semantic:
    chart: data-semantic
    version: 0.4.0-main.20260414.1
  data-view:
    chart: data-view
    version: 0.4.0-main.20260403.1
  sailor-agent:
    chart: sailor-agent
    version: 0.4.0-main.20260420.2
  standardization:
    chart: standardization
    version: 0.4.0-main.20260416.2
  dip-studio:
    chart: dip-studio
    version: 0.5.0-main.1bc3bb01
    values:
      studio:
        envFileHostPath: /root/.env         # 环境变量配置主机路径，例如：/root/.env。文件不存在时会自动创建。
        OpenClawHostPath: /root/.openclaw   # .openclaw 目录主机路径，例如：/root/.openclaw
        useExternalOpenClaw: false          # 是否使用外置 OpenClaw，默认为 false。当设置为 true 时，studio 将不会启动容器内的 OpenClaw 网关。

  # ===== 新 pipeline（OCI + ghcr，显式覆盖 source 默认） =====
  auth-service:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    imageRegistry: ghcr.io/kweaver-ai
    chart: auth-service
    version: 0.4.0-main.20260417.3
  basic-search:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    imageRegistry: ghcr.io/kweaver-ai
    chart: basic-search
    version: 0.4.0-main.20260331.1
  configuration-center:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    imageRegistry: ghcr.io/kweaver-ai
    chart: configuration-center
    version: 0.4.0-main.20260417.2
  data-application-gateway:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    imageRegistry: ghcr.io/kweaver-ai
    chart: data-application-gateway
    version: 0.4.0-main.20260403.1
  data-application-service:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    imageRegistry: ghcr.io/kweaver-ai
    chart: data-application-service
    version: 0.4.0-main.20260403.1
  data-catalog:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    imageRegistry: ghcr.io/kweaver-ai
    chart: data-catalog
    version: 0.4.0-main.20260414.1
  data-exploration-service:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    imageRegistry: ghcr.io/kweaver-ai
    chart: data-exploration-service
    version: 0.4.0-main.20260403.1
  data-subject:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    imageRegistry: ghcr.io/kweaver-ai
    chart: data-subject
    version: 0.4.0-main.20260414.1
  sailor:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    imageRegistry: ghcr.io/kweaver-ai
    chart: sailor
    version: 0.4.0-main.20260416.2
  sailor-service:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    imageRegistry: ghcr.io/kweaver-ai
    chart: sailor-service
    version: 0.4.0-main.20260417.1
  session:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    imageRegistry: ghcr.io/kweaver-ai
    chart: session
    version: 0.4.0-main.20260403.2
  task-center:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    imageRegistry: ghcr.io/kweaver-ai
    chart: task-center
    version: 0.4.0-main.20260403.1
