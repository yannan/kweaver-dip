apiVersion: deploy.kweaver.ai/v1alpha1
kind: VersionSet
product: kweaver-dip
# 滚动 main 通道 manifest：跟踪每个服务在 main 分支的最新构建。
# 已迁移到 kweaver-dip github-action pipeline 的服务，version 固定为 "main-latest"，
# CI 在每次 push main 时校验该字段（不一致则 fail，CI 永不写入此文件）。
# 因此 bump VERSION 文件时无须修改本 manifest。
# 未迁移的服务暂时保留 0.6.0 frozen 时的版本，等迁移到新 pipeline 后再替换。
version: main
source:
  helmRepoUrl: https://kweaver-ai.github.io/helm-repo/
  imageRegistry: swr.cn-east-3.myhuaweicloud.com/kweaver-ai
dependencies:
- product: isf
  version: 0.6.0
  manifest: ../0.6.0/isf.yaml
- product: kweaver-core
  version: 0.6.0
  manifest: ../0.6.0/kweaver-core.yaml

releases:
  # ===== 旧 pipeline（继承 source 默认：HTTP helm 仓库 + SWR 镜像仓库） =====
  # 这些服务尚未迁移到 kweaver-dip github-action pipeline，version 沿用 0.6.0
  # 快照值。迁移完成后请把对应条目移到下方"新 pipeline"段并改为 main-latest。
  dip-data-migrator:
    chart: dip-data-migrator
    version: 0.5.0-main.20260420.1.2f7545f
    stage: pre
  business-system-service:
    chart: business-system-service
    version: 0.3.0-1d43acc
  mf-model-manager-nginx:
    chart: mf-model-manager-nginx
    version: 0.5.0-main.git-2a143e0.1796934
  vega-web:
    chart: vega-web
    version: 0.5.1-main
  operator-web:
    chart: operator-web
    version: 0.5.0-main.git-671eead
  mdl-manage-web:
    chart: mdl-manage-web
    version: 0.5.0-develop.git-c7b1b0
  agent-web:
    chart: agent-web
    version: 0.5.1-main.git-a89f3eb
  flow-web:
    chart: flow-web
    version: 0.5.1-main.git+671eead
  doc-audit-client:
    chart: doc-audit-client
    version: 0.5.1-main.git-671eead
  workflow:
    chart: workflow
    version: 0.3.0-main.git-git+37cf114.1795485
  workflow-manage-client:
    chart: workflow-manage-client
    version: 0.5.0-main.git-84bea21
  workflow-manage-front:
    chart: workflow-manage-front
    version: 0.5.0-main.git-84bea21
  dip-hub:
    chart: dip-hub
    version: 0.5.0
  dip-frontend:
    chart: dip-frontend
    version: 0.5.0-main.5ba829f
    values:
      runtimeEnv:
        publicEnabledModules: "store,studio"  # 允许值：store,studio（多个用英文逗号分隔）
  data-semantic:
    chart: data-semantic
    version: 0.4.0-main.20260414.1
  dip-studio:
    chart: dip-studio
    version: 0.5.0-main.1bc3bb01
    values:
      studio:
        envFileHostPath: /root/.env         # 环境变量配置主机路径，例如：/root/.env。文件不存在时会自动创建。
        OpenClawHostPath: /root/.openclaw   # .openclaw 目录主机路径，例如：/root/.openclaw
        useExternalOpenClaw: false          # 是否使用外置 OpenClaw，默认为 false。当设置为 true 时，studio 将不会启动容器内的 OpenClaw 网关。

  # ===== 新 pipeline（OCI + ghcr，由 kweaver-dip github-action pipeline 维护） =====
  # 每条 entry 的 version 固定为 "main-latest"，CI 在 push main 时校验。
  # bump VERSION 文件不需要改这一段。
  # imageRegistry 回退到 source.imageRegistry（SWR），不在 per-release 层覆盖。
  auth-service:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: auth-service
    version: main-latest
  basic-search:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: basic-search
    version: main-latest
  configuration-center:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: configuration-center
    version: main-latest
  data-application-gateway:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: data-application-gateway
    version: main-latest
  data-application-service:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: data-application-service
    version: main-latest
  data-catalog:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: data-catalog
    version: main-latest
  data-exploration-service:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: data-exploration-service
    version: main-latest
  data-subject:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: data-subject
    version: main-latest
  data-view:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: data-view
    version: main-latest
  anyfabric-frontend:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: anyfabric-frontend
    version: main-latest
  sailor:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: sailor
    version: main-latest
  sailor-agent:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: sailor-agent
    version: main-latest
  sailor-service:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: sailor-service
    version: main-latest
  session:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: session
    version: main-latest
  standardization:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: standardization
    version: main-latest
  task-center:
    helmRepoUrl: oci://ghcr.io/kweaver-ai/charts
    chart: task-center
    version: main-latest
