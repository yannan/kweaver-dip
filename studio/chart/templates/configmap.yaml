apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Values.namespace }}
data:
  NODE_ENV: {{ .Values.studio.nodeEnv | quote }}
  KWEAVER_HYDRA_ADMIN_URL: {{ .Values.studio.KWeaverHydraAdminURL | quote }}
  USE_EXTERNAL_OPENCLAW: {{ .Values.studio.useExternalOpenClaw | quote }}
  OTEL_TRACE_ENABLED: {{ .Values.otel.trace.enabled | quote }}
  OTEL_SERVICE_NAME: {{ default "studio" .Values.otel.service_name | quote }}
  OTEL_SERVICE_VERSION: {{ default .Values.image.tag .Values.otel.service_version | quote }}
  OTEL_ENVIRONMENT: {{ default .Values.studio.nodeEnv .Values.otel.environment | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ default "http://otelcol-contrib:4318" .Values.otel.otlp_endpoint | quote }}
  OTEL_TRACE_EXPORTER: {{ default "otlp" .Values.otel.trace.exporter | quote }}
  OTEL_TRACE_SAMPLING_RATE: {{ .Values.otel.trace.sampling_rate | quote }}
  OTEL_LOG_ENABLED: {{ .Values.otel.log.enabled | quote }}
  OTEL_LOG_LEVEL: {{ .Values.otel.log.level | quote }}
  OTEL_LOG_EXPORTER: {{ default "otlp" .Values.otel.log.exporter | quote }}
