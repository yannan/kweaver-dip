name: basic-search-build

on:
  push:
    paths:
      - "dsg/services/apps/basic-search/**"
      - ".github/workflows/basic-search-build.yaml"
      - ".github/workflows/reusable-build-service.yml"
      - "VERSION"
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Whether to also publish the latest tag"
        required: false
        default: "false"

jobs:
  build:
    uses: ./.github/workflows/reusable-build-service.yml
    with:
      service_name: basic-search
      image_name: af/basic-search
      chart_dir: dsg/services/apps/basic-search/helm/basic-search
      dockerfile: dsg/services/apps/basic-search/docker/Dockerfile
      build_context: dsg
      push_latest: ${{ inputs.push_latest || 'false' }}
    secrets: inherit
