name: Build And Push auth-service

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "dsg/services/apps/auth-service/**"
      - ".github/workflows/auth-service-build-and-push.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "dsg/services/apps/auth-service/**"
      - ".github/workflows/auth-service-build-and-push.yml"
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Whether to also publish the latest tag"
        required: false
        default: "false"

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: kweaver-ai
  SERVICE_NAME: auth-service
  SERVICE_DIR: dsg/services/apps/auth-service
  CHART_DIR: dsg/services/apps/auth-service/helm/auth-service
  DOCKERFILE: dsg/services/apps/auth-service/docker/Dockerfile

jobs:
  release-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_tag_no_sha: ${{ steps.version.outputs.release_tag_no_sha }}
      push_latest: ${{ steps.version.outputs.push_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release version
        id: version
        env:
          WORKFLOW_PUSH_LATEST: ${{ inputs.push_latest || 'false' }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          SHOULD_PUSH_LATEST="false"

          # Read chart version as the base semver
          CHART_VERSION="$(
            grep -m1 -E '^version:' "${CHART_DIR}/Chart.yaml" \
              | awk '{print $2}' | tr -d '"' | tr -d "'" | tr -d '\r'
          )"
          if [ -z "${CHART_VERSION}" ]; then
            echo "ERROR: unable to read version from ${CHART_DIR}/Chart.yaml" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${RELEASE_VERSION}-${SHORT_SHA}"
            RELEASE_TAG_NO_SHA="${RELEASE_VERSION}"
          else
            BRANCH_OR_REF="${GITHUB_REF_NAME//\//-}"
            RELEASE_TAG="${CHART_VERSION}-${BRANCH_OR_REF}.${SHORT_SHA}"
            RELEASE_TAG_NO_SHA="${CHART_VERSION}-${BRANCH_OR_REF}"
          fi

          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ] || [ "${WORKFLOW_PUSH_LATEST:-false}" = "true" ]; then
            SHOULD_PUSH_LATEST="true"
          fi

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_tag_no_sha=${RELEASE_TAG_NO_SHA}"
            echo "push_latest=${SHOULD_PUSH_LATEST}"
          } >> "${GITHUB_OUTPUT}"

  docker:
    needs:
      - release-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In To GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.SERVICE_NAME }}
          tags: |
            type=raw,value=${{ needs.release-version.outputs.release_tag }}
            type=raw,value=${{ needs.release-version.outputs.release_tag_no_sha }}
            type=raw,value=latest,enable=${{ needs.release-version.outputs.push_latest == 'true' }}

      - name: Build (PR) / Build & Push (branch)
        uses: docker/build-push-action@v6
        with:
          context: dsg
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVER_VERSION=${{ needs.release-version.outputs.release_tag_no_sha }}
            GIT_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,mode=max,scope=auth-service

  helm-chart:
    if: github.event_name != 'pull_request'
    needs:
      - release-version
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Align chart version, appVersion and image fields
        env:
          RELEASE_TAG: ${{ needs.release-version.outputs.release_tag }}
        run: |
          python3 <<'PY'
          import os, re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          chart_dir = Path(os.environ["CHART_DIR"])

          chart = chart_dir / "Chart.yaml"
          text = chart.read_text(encoding="utf-8")
          text = re.sub(r"(?m)^version:.*$",    f'version: "{tag}"',    text)
          text = re.sub(r"(?m)^appVersion:.*$", f'appVersion: "{tag}"', text)
          chart.write_text(text, encoding="utf-8")

          values = chart_dir / "values.yaml"
          vt = values.read_text(encoding="utf-8")
          vt = re.sub(r"(?m)^(\s*registry:\s*).*$",   r'\1ghcr.io',                 vt, count=1)
          vt = re.sub(r"(?m)^(\s*repository:\s*).*$", r'\1kweaver-ai/auth-service', vt, count=1)
          vt = re.sub(r"(?m)^(\s*tag:\s*).*$",        rf'\1"{tag}"',                vt, count=1)
          values.write_text(vt, encoding="utf-8")
          PY

      - name: Lint Helm Chart
        run: helm lint "${CHART_DIR}"

      - name: Render Helm Chart (default values)
        run: helm template auth-service "${CHART_DIR}" > /dev/null

      - name: Package Helm Chart
        run: |
          mkdir -p dist-chart
          helm package "${CHART_DIR}" --destination dist-chart

      - name: Log In To GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push Chart to GHCR (OCI)
        run: |
          set -euo pipefail
          for tgz in dist-chart/*.tgz; do
            echo "Pushing ${tgz} to oci://${REGISTRY}/${IMAGE_NAMESPACE}/charts"
            helm push "${tgz}" "oci://${REGISTRY}/${IMAGE_NAMESPACE}/charts"
          done

      - name: Upload Chart Package (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-chart
          path: dist-chart/*.tgz
          if-no-files-found: error
