name: session-build

on:
  push:
    branches:
      - main
      - master
      - github-action-build  # TODO: remove after CI migration stabilizes
    tags:
      - "v*"
    paths:
      - "dsg/services/apps/session/**"
      - ".github/workflows/session-build.yaml"
      - ".github/workflows/reusable-build-service.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "dsg/services/apps/session/**"
      - ".github/workflows/session-build.yaml"
      - ".github/workflows/reusable-build-service.yml"
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Whether to also publish the latest tag"
        required: false
        default: "false"

jobs:
  build:
    uses: ./.github/workflows/reusable-build-service.yml
    with:
      service_name: session
      image_name: af/session
      chart_dir: dsg/services/apps/session/helm/session
      dockerfile: dsg/services/apps/session/docker/Dockerfile
      build_context: dsg
      push_latest: ${{ inputs.push_latest || 'false' }}
    secrets: inherit
