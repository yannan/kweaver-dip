name: Reusable - Build And Push Service

on:
  workflow_call:
    inputs:
      service_name:
        description: "Service name (used for job names, chart name, cache scope)"
        required: true
        type: string
      image_name:
        description: "Image name under IMAGE_NAMESPACE, e.g. af/auth-service"
        required: true
        type: string
      chart_dir:
        description: "Path to helm chart directory"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: true
        type: string
      build_context:
        description: "Docker build context (defaults to 'dsg' monorepo root)"
        required: false
        type: string
        default: "dsg"
      image_repository:
        description: "Full repository value for Helm values.yaml (e.g. kweaver-ai/af/auth-service)"
        required: false
        type: string
        default: ""
      chart_name:
        description: "Helm chart name (defaults to service_name)"
        required: false
        type: string
        default: ""
      push_latest:
        description: "Publish latest tag (in addition to branch detection)"
        required: false
        type: string
        default: "false"

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: kweaver-ai

jobs:
  release-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_tag_no_sha: ${{ steps.version.outputs.release_tag_no_sha }}
      push_latest: ${{ steps.version.outputs.push_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release version
        id: version
        env:
          CHART_DIR: ${{ inputs.chart_dir }}
          WORKFLOW_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          # Use committer date (UTC) so the version is deterministic for a given commit.
          COMMIT_TS="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)"
          SHOULD_PUSH_LATEST="false"

          CHART_VERSION="$(
            grep -m1 -E '^version:' "${CHART_DIR}/Chart.yaml" \
              | awk '{print $2}' | tr -d '"' | tr -d "'" | tr -d '\r'
          )"
          if [ -z "${CHART_VERSION}" ]; then
            echo "ERROR: unable to read version from ${CHART_DIR}/Chart.yaml" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${RELEASE_VERSION}-${SHORT_SHA}"
            RELEASE_TAG_NO_SHA="${RELEASE_VERSION}"
          else
            BRANCH_OR_REF="${GITHUB_REF_NAME//\//-}"
            # Format: <chartVer>-<branch>.<UTC-commit-timestamp>.<shortSha>
            # Timestamp as a numeric SemVer pre-release identifier makes tags
            # sortable by commit time via `sort -V`, so release-manifest
            # workflows can discover the latest chart on OCI deterministically.
            RELEASE_TAG="${CHART_VERSION}-${BRANCH_OR_REF}.${COMMIT_TS}.${SHORT_SHA}"
            RELEASE_TAG_NO_SHA="${CHART_VERSION}-${BRANCH_OR_REF}"
          fi

          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ] || [ "${WORKFLOW_PUSH_LATEST:-false}" = "true" ]; then
            SHOULD_PUSH_LATEST="true"
          fi

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_tag_no_sha=${RELEASE_TAG_NO_SHA}"
            echo "push_latest=${SHOULD_PUSH_LATEST}"
          } >> "${GITHUB_OUTPUT}"

  # Build each platform on a native runner in parallel, push by digest.
  docker-build:
    needs:
      - release-version
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image_name }}
    steps:
      - name: Prepare platform pair
        id: platform
        run: |
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In To GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image_name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SERVER_VERSION=${{ needs.release-version.outputs.release_tag_no_sha }}
            GIT_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ inputs.service_name }}-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}-${{ steps.platform.outputs.pair }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.service_name }}-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # PR: only verify that amd64 builds, don't push.
  docker-pr-verify:
    needs:
      - release-version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 (verify only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          build-args: |
            SERVER_VERSION=${{ needs.release-version.outputs.release_tag_no_sha }}
            GIT_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ inputs.service_name }}-linux-amd64

  # Merge per-arch digests into a single multi-arch manifest with proper tags.
  docker-merge:
    needs:
      - release-version
      - docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.service_name }}-*
          merge-multiple: true

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In To GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ needs.release-version.outputs.release_tag }}
            type=raw,value=${{ needs.release-version.outputs.release_tag_no_sha }}
            type=raw,value=latest,enable=${{ needs.release-version.outputs.push_latest == 'true' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image_name }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image_name }}:${{ needs.release-version.outputs.release_tag }}

  helm-chart:
    if: github.event_name != 'pull_request'
    needs:
      - release-version
      - docker-merge
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Align chart version, appVersion and image fields
        env:
          RELEASE_TAG: ${{ needs.release-version.outputs.release_tag }}
          CHART_DIR: ${{ inputs.chart_dir }}
          IMAGE_REPOSITORY_OVERRIDE: ${{ inputs.image_repository }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          python3 <<'PY'
          import os, re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          chart_dir = Path(os.environ["CHART_DIR"])
          override = os.environ.get("IMAGE_REPOSITORY_OVERRIDE", "").strip()
          repo = override or f"kweaver-ai/{os.environ['IMAGE_NAME']}"

          chart = chart_dir / "Chart.yaml"
          text = chart.read_text(encoding="utf-8")
          text = re.sub(r"(?m)^version:.*$",    f'version: "{tag}"',    text)
          text = re.sub(r"(?m)^appVersion:.*$", f'appVersion: "{tag}"', text)
          chart.write_text(text, encoding="utf-8")

          values = chart_dir / "values.yaml"
          vt = values.read_text(encoding="utf-8")
          vt = re.sub(r"(?m)^(\s*registry:\s*).*$",   r'\1ghcr.io',     vt, count=1)
          vt = re.sub(r"(?m)^(\s*repository:\s*).*$", rf'\1{repo}',     vt, count=1)
          vt = re.sub(r"(?m)^(\s*tag:\s*).*$",        rf'\1"{tag}"',    vt, count=1)
          values.write_text(vt, encoding="utf-8")
          PY

      - name: Lint Helm Chart (non-blocking)
        env:
          CHART_DIR: ${{ inputs.chart_dir }}
        run: helm lint "${CHART_DIR}" || echo "::warning::helm lint reported issues (non-blocking, matches legacy pipeline behavior)"

      - name: Render Helm Chart (non-blocking, default values)
        env:
          CHART_DIR: ${{ inputs.chart_dir }}
          CHART_NAME: ${{ inputs.chart_name != '' && inputs.chart_name || inputs.service_name }}
        run: helm template "${CHART_NAME}" "${CHART_DIR}" > /dev/null || echo "::warning::helm template render failed with default values (non-blocking; real deployments inject values)"

      - name: Package Helm Chart
        env:
          CHART_DIR: ${{ inputs.chart_dir }}
        run: |
          mkdir -p dist-chart
          helm package "${CHART_DIR}" --destination dist-chart

      - name: Log In To GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push Chart to GHCR (OCI)
        run: |
          set -euo pipefail
          for tgz in dist-chart/*.tgz; do
            echo "Pushing ${tgz} to oci://${REGISTRY}/${IMAGE_NAMESPACE}/charts"
            helm push "${tgz}" "oci://${REGISTRY}/${IMAGE_NAMESPACE}/charts"
          done

      - name: Upload Chart Package (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service_name }}-chart
          path: dist-chart/*.tgz
          if-no-files-found: error

  # Auto-bump chart version in deploy/release-manifests/main/kweaver-dip.yaml
  # for rolling "main" channel. Only runs on direct push to main / master
  # (i.e. after a PR is merged). Feature / test branches must edit manifests
  # manually; they never mutate the main-channel manifest.
  update-main-manifest:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')
    needs:
      - release-version
      - helm-chart
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      # Serialize manifest updates across parallel service builds on the same branch
      # so concurrent yq edits don't clobber each other.
      group: update-main-manifest-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      MANIFEST_PATH: deploy/release-manifests/main/kweaver-dip.yaml
      RELEASE_KEY: ${{ inputs.chart_name != '' && inputs.chart_name || inputs.service_name }}
      NEW_VERSION: ${{ needs.release-version.outputs.release_tag }}
    steps:
      - name: Checkout (with full history on target ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Check manifest entry exists
        run: |
          set -euo pipefail
          if [ ! -f "${MANIFEST_PATH}" ]; then
            echo "::warning::${MANIFEST_PATH} does not exist; skipping auto-update."
            exit 0
          fi
          if ! yq -e ".releases.\"${RELEASE_KEY}\"" "${MANIFEST_PATH}" >/dev/null 2>&1; then
            echo "::warning::release key '${RELEASE_KEY}' not found in ${MANIFEST_PATH}; skipping auto-update."
            echo "SKIP=true" >> "${GITHUB_ENV}"
          fi

      - name: Update chart version in manifest
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          CURRENT="$(yq -r ".releases.\"${RELEASE_KEY}\".version // \"\"" "${MANIFEST_PATH}")"
          if [ "${CURRENT}" = "${NEW_VERSION}" ]; then
            echo "Manifest already pinned to ${NEW_VERSION}; nothing to do."
            echo "SKIP=true" >> "${GITHUB_ENV}"
            exit 0
          fi
          RELEASE_KEY="${RELEASE_KEY}" NEW_VERSION="${NEW_VERSION}" \
            yq -i '.releases[strenv(RELEASE_KEY)].version = strenv(NEW_VERSION)' "${MANIFEST_PATH}"
          echo "Updated ${RELEASE_KEY}: ${CURRENT} -> ${NEW_VERSION}"

      - name: Commit and push
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry loop to handle race with other concurrent service updates
          # (concurrency group should already serialize us, but be defensive).
          for attempt in 1 2 3; do
            git add "${MANIFEST_PATH}"
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "chore(manifest): bump ${RELEASE_KEY} to ${NEW_VERSION} [skip ci]"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "Pushed manifest update."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); pulling --rebase and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            # Re-apply the yq edit on top of the rebased tree (previous commit may be gone after rebase).
            RELEASE_KEY="${RELEASE_KEY}" NEW_VERSION="${NEW_VERSION}" \
              yq -i '.releases[strenv(RELEASE_KEY)].version = strenv(NEW_VERSION)' "${MANIFEST_PATH}"
          done
          echo "::error::Failed to push manifest update after 3 attempts."
          exit 1
