name: standardization-backend-build

on:
  push:
    branches:
      - main
      - master
      - github-action-build  # TODO: remove after CI migration stabilizes
    tags:
      - "v*"
    paths:
      - "dsg/services/standardization-backend/**"
      - ".github/workflows/standardization-backend-build.yml"
      - ".github/workflows/reusable-build-service.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "dsg/services/standardization-backend/**"
      - ".github/workflows/standardization-backend-build.yml"
      - ".github/workflows/reusable-build-service.yml"
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Whether to also publish the latest tag"
        required: false
        default: "false"

jobs:
  build:
    uses: ./.github/workflows/reusable-build-service.yml
    with:
      service_name: standardization-backend
      image_name: af/standardization/backend
      chart_dir: dsg/services/standardization-backend/helm/standardization
      chart_name: standardization
      dockerfile: dsg/services/standardization-backend/docker/Dockerfile
      build_context: dsg/services/standardization-backend
      push_latest: ${{ inputs.push_latest || 'false' }}
    secrets: inherit
