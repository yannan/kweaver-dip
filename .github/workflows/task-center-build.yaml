name: task-center-build

on:
  push:
    paths:
      - "dsg/services/apps/task_center/**"
      - ".github/workflows/task-center-build.yaml"
      - ".github/workflows/reusable-build-service.yml"
      - "VERSION"
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Whether to also publish the latest tag"
        required: false
        default: "false"

jobs:
  build:
    uses: ./.github/workflows/reusable-build-service.yml
    with:
      service_name: task-center
      image_name: af/task-center
      chart_dir: dsg/services/apps/task_center/helm/task-center
      dockerfile: dsg/services/apps/task_center/docker/Dockerfile
      build_context: dsg
      push_latest: ${{ inputs.push_latest || 'false' }}
    secrets: inherit
