name: data-application-service-build

on:
  push:
    branches:
      - main
      - master
      - github-action-build  # TODO: remove after CI migration stabilizes
    tags:
      - "v*"
    paths:
      - "dsg/services/apps/data-application-service/**"
      - ".github/workflows/data-application-service-build.yml"
      - ".github/workflows/reusable-build-service.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "dsg/services/apps/data-application-service/**"
      - ".github/workflows/data-application-service-build.yml"
      - ".github/workflows/reusable-build-service.yml"
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Whether to also publish the latest tag"
        required: false
        default: "false"

jobs:
  build:
    uses: ./.github/workflows/reusable-build-service.yml
    with:
      service_name: data-application-service
      image_name: af/data-application-service
      chart_dir: dsg/services/apps/data-application-service/helm/data-application-service
      dockerfile: dsg/services/apps/data-application-service/docker/Dockerfile
      build_context: dsg
      push_latest: ${{ inputs.push_latest || 'false' }}
    secrets: inherit
