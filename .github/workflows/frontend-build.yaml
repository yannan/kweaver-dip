name: frontend-build

on:
  push:
    paths:
      - "dsg/frontend/**"
      - ".github/workflows/frontend-build.yaml"
      - ".github/workflows/reusable-build-service.yml"
      - "VERSION"
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Whether to also publish the latest tag"
        required: false
        default: "false"

jobs:
  build:
    uses: ./.github/workflows/reusable-build-service.yml
    with:
      service_name: anyfabric-frontend
      image_name: af/any-fabric-frontend
      chart_dir: dsg/frontend/helm/anyfabric-frontend
      dockerfile: dsg/frontend/ci/Dockerfile
      build_context: dsg/frontend
      push_latest: ${{ inputs.push_latest || 'false' }}
    secrets: inherit
